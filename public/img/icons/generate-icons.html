<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate PWA Icons</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }
    .icon-preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .icon-item {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .icon-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #FE7743 0%, #ff5722 100%);
      border-radius: 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .download-btn {
      background: #FE7743;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    .download-btn:hover {
      background: #ff5722;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Universal Rent a Car - PWA Icons Generator</h1>
  
  <p>Esta página permite gerar ícones básicos para a PWA. Para ícones profissionais, recomendamos usar um logo customizado.</p>
  
  <div class="icon-preview">
    <div class="icon-item">
      <div class="icon-placeholder">U</div>
      <small>192x192</small>
    </div>
    <div class="icon-item">
      <div class="icon-placeholder">U</div>
      <small>512x512</small>
    </div>
  </div>
  
  <div style="text-align: center;">
    <button class="download-btn" onclick="generateIcons()">Gerar Ícones Básicos</button>
    <p style="margin-top: 20px; color: #666;">
      <strong>Ou</strong> faça upload do seu próprio logo:
      <input type="file" accept="image/*" onchange="handleUpload(event)" style="margin-top: 10px;">
    </p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const sizes = [16, 32, 152, 144, 192, 512];
    
    function generateIcons() {
      sizes.forEach(size => {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = size;
        canvas.height = size;
        
        // Create gradient background
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#FE7743');
        gradient.addColorStop(1, '#ff5722');
        
        // Draw rounded rectangle
        const radius = size * 0.2;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(size - radius, 0);
        ctx.arcTo(size, 0, size, radius, radius);
        ctx.lineTo(size, size - radius);
        ctx.arcTo(size, size, size - radius, size, radius);
        ctx.lineTo(radius, size);
        ctx.arcTo(0, size, 0, size - radius, radius);
        ctx.lineTo(0, radius);
        ctx.arcTo(0, 0, radius, 0, radius);
        ctx.closePath();
        ctx.fill();
        
        // Draw text
        ctx.fillStyle = 'white';
        ctx.font = `bold ${size * 0.6}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('U', size / 2, size / 2);
        
        // Download
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          
          let filename;
          if (size === 16) filename = 'favicon-16x16.png';
          else if (size === 32) filename = 'favicon-32x32.png';
          else if (size === 152) filename = 'apple-touch-icon-152x152.png';
          else if (size === 144) filename = 'msapplication-icon-144x144.png';
          else if (size === 192) filename = 'android-chrome-192x192.png';
          else if (size === 512) filename = 'android-chrome-512x512.png';
          
          a.download = filename;
          a.click();
        });
      });
      
      alert('Ícones gerados! Verifique sua pasta de downloads e mova-os para public/img/icons/');
    }
    
    function handleUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          sizes.forEach(size => {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Draw uploaded image
            ctx.drawImage(img, 0, 0, size, size);
            
            // Download
            canvas.toBlob(blob => {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              
              let filename;
              if (size === 16) filename = 'favicon-16x16.png';
              else if (size === 32) filename = 'favicon-32x32.png';
              else if (size === 152) filename = 'apple-touch-icon-152x152.png';
              else if (size === 144) filename = 'msapplication-icon-144x144.png';
              else if (size === 192) filename = 'android-chrome-192x192.png';
              else if (size === 512) filename = 'android-chrome-512x512.png';
              
              a.download = filename;
              a.click();
            });
          });
          
          alert('Ícones gerados com seu logo! Verifique sua pasta de downloads.');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
