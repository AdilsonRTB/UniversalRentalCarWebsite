server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Disable cache for index.html to ensure users get latest version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # No cache for all static assets do SPA.
    # ^~ nas rotas de proxy abaixo garante que /media/*.png, /vehicle-rental/*.js
    # etc. NÃO caiam aqui (que serviria do disco -> 404) e sim no proxy.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        access_log off;
    }

    # Default location - no cache for HTML, moderate cache for other files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy para a API
    location ^~ /api/ {
        proxy_pass ${API_TARGET};
        # $http_host preserva host + porta (ex.: 127.0.0.1:8011) para o backend
        # gerar URLs absolutas corretas (imagens em /media/, etc.)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para health
    location ^~ /health/ {
        proxy_pass ${HEALTH_TARGET};
        # $http_host preserva host + porta (ex.: 127.0.0.1:8011) para o backend
        # gerar URLs absolutas corretas (imagens em /media/, etc.)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para vehicle-rental
    location ^~ /vehicle-rental/ {
        proxy_pass ${VEHICLE_TARGET};
        # $http_host preserva host + porta (ex.: 127.0.0.1:8011) para o backend
        # gerar URLs absolutas corretas (imagens em /media/, etc.)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para media (fotos de viaturas)
    location ^~ /media/ {
        proxy_pass ${VEHICLE_TARGET};
        # $http_host preserva host + porta (ex.: 127.0.0.1:8011) para o backend
        # gerar URLs absolutas corretas (imagens em /media/, etc.)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
